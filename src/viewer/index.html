<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>__CREATURE__</title>
<meta name="description" content="An autonomous owl living in a town on your network. He makes his own decisions, keeps a diary, and remembers the people who visit.">
<style>
  :root{
    --ink:#efe6d8; --dim:#a8998a; --faint:#6f635a;
    --amber:#e2b45c; --line:rgba(238,226,208,.14);
    --panel:rgba(22,18,15,.74);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0f0d0b;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab;touch-action:none}
  #view.drag{cursor:grabbing}

  .hud{position:fixed;z-index:10;pointer-events:none}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto}

  #top-left{top:18px;left:18px;display:flex;flex-direction:column;gap:8px;max-width:340px}
  #name{display:flex;align-items:baseline;gap:10px}
  #name h1{margin:0;font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:500;
    font-size:22px;letter-spacing:.08em}
  #name .jp{font-size:11px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase}
  #town-line{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #town-line b{color:var(--amber);font-weight:500}
  #town-line .dot{opacity:.35}

  #nav{top:18px;right:18px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  #nav a{pointer-events:auto;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);text-decoration:none;padding:7px 11px;border:1px solid var(--line);
    border-radius:999px;background:rgba(20,17,14,.55);transition:.15s}
  #nav a:hover{color:var(--ink);border-color:rgba(226,180,92,.5)}

  #bottom-left{bottom:18px;left:18px;width:250px;padding:14px 15px 12px}
  .need{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .need span{width:62px;flex:none}
  .track{flex:1;height:3px;background:rgba(238,226,208,.1);border-radius:2px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:2px;transition:width .6s ease}
  .need b{width:26px;text-align:right;font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}
  #mood-line{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    display:flex;justify-content:space-between}

  #doing{bottom:18px;left:50%;transform:translateX(-50%);max-width:min(520px,calc(100vw - 380px));
    padding:13px 18px;text-align:center;transition:opacity .5s ease}
  #doing .label{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
  #doing .thought{margin-top:7px;font-family:ui-serif,Georgia,serif;font-style:italic;
    font-size:15px;line-height:1.45;color:#eadfce}
  #doing .thought:empty{display:none}

  #ticker{bottom:18px;right:18px;width:280px;padding:12px 14px;max-height:190px;overflow:hidden}
  #ticker .ttl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  #ticker ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  #ticker li{font-size:12px;line-height:1.4;color:var(--dim);
    opacity:0;animation:fadein .5s forwards}
  #ticker li:first-child{color:var(--ink)}
  #ticker li::before{content:"·";color:var(--amber);margin-right:6px;opacity:.6}
  @keyframes fadein{to{opacity:1}}

  #zoom{position:fixed;bottom:18px;right:306px;display:flex;flex-direction:column;gap:4px;z-index:11}
  #zoom button{pointer-events:auto;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);
    background:rgba(22,18,15,.7);color:var(--dim);font-size:14px;line-height:1;cursor:pointer}
  #zoom button:hover{color:var(--ink)}

  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;
    background:radial-gradient(120% 90% at 50% 45%,#241d1a 0%,#14100e 60%,#0d0a09 100%);
    transition:opacity 1.1s ease, visibility 1.1s}
  #splash.gone{opacity:0;visibility:hidden}
  #splash .jp{font-size:clamp(44px,10vw,92px);font-weight:700;letter-spacing:.16em;
    color:rgba(255,249,242,.95);margin-left:.16em;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
  #splash .nm{font-family:ui-serif,Georgia,serif;font-size:15px;letter-spacing:.42em;
    text-transform:uppercase;color:rgba(238,226,208,.55);margin-top:-10px}
  #splash .bar{width:min(220px,48vw);height:2px;border-radius:2px;background:rgba(238,226,208,.13);overflow:hidden}
  #splash .bar i{display:block;height:100%;width:0;background:rgba(238,226,208,.6);
    transition:width .5s ease}
  #splash .msg{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(238,226,208,.4);height:16px}

  #wake{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;
    background:rgba(10,8,7,.86);color:var(--dim);font-size:12px;letter-spacing:.2em;
    text-transform:uppercase}

  @media (max-width:860px){
    #ticker,#zoom{display:none}
    #bottom-left{width:190px;padding:11px 12px}
    #doing{max-width:calc(100vw - 40px);left:50%;bottom:130px;transform:translateX(-50%)}
    #nav{top:auto;bottom:18px;left:auto;right:18px;max-width:120px}
    #nav a{font-size:9px;padding:5px 8px}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="splash">
  <div class="jp">フエンウィック</div>
  <div class="nm">__CREATURE__</div>
  <div class="bar"><i></i></div>
  <div class="msg">waking up</div>
</div>

<div class="hud" id="top-left">
  <div id="name"><h1>__CREATURE__</h1><span class="jp">an owl</span></div>
  <div id="town-line">
    <span>day <b id="day">—</b></span><span class="dot">·</span>
    <span><b id="time">—</b></span><span class="dot">·</span>
    <span id="weather">—</span><span class="dot">·</span>
    <span id="place">—</span>
  </div>
</div>

<div class="hud" id="nav">
  <a href="/diary">diary</a>
  <a href="/memories">memories</a>
  <a href="/mind">mind</a>
  <a href="/offerings">leave something</a>
</div>

<div class="hud panel" id="bottom-left">
  <div class="need"><span>hunger</span><div class="track"><i id="n-hunger" style="background:#c98a5a"></i></div><b id="v-hunger">0</b></div>
  <div class="need"><span>tiredness</span><div class="track"><i id="n-fatigue" style="background:#7f8fb0"></i></div><b id="v-fatigue">0</b></div>
  <div class="need"><span>boredom</span><div class="track"><i id="n-curiosity" style="background:#b0a35f"></i></div><b id="v-curiosity">0</b></div>
  <div class="need"><span>unease</span><div class="track"><i id="n-unease" style="background:#a9708a"></i></div><b id="v-unease">0</b></div>
  <div id="mood-line"><span id="mood">—</span><span id="energy">—</span></div>
</div>

<div class="hud panel" id="doing">
  <div class="label" id="doing-label">standing around</div>
  <div class="thought" id="doing-thought"></div>
</div>

<div class="hud panel" id="ticker">
  <div class="ttl">what just happened</div>
  <ul id="ticker-list"></ul>
</div>

<div id="zoom">
  <button id="z-in" title="zoom in">+</button>
  <button id="z-out" title="zoom out">−</button>
</div>

<script src="/app.js"></script>
</body>
</html>
